{% extends 'layouts/base.html' %} {% include 'components/navbar.html' %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Create Blog Post{% endblock %}</title>

    {% block head_styles %}
    <link
      href="https://cdn.jsdelivr.net/npm/froala-editor@latest/css/froala_editor.pkgd.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/froala-editor@latest/css/themes/dark.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/froala-editor@latest/css/plugins/paragraph_format.min.css"
      rel="stylesheet"
    />

    <style>
      /* Ensure headings are styled in the editor and output */
      #editor h1 {
        font-size: 2.5rem;
        font-weight: bold;
        margin-bottom: 1rem;
        line-height: 1.2;
      }
      #editor h2 {
        font-size: 2rem;
        font-weight: bold;
        margin-bottom: 0.75rem;
        line-height: 1.2;
      }
      #editor h3 {
        font-size: 1.75rem;
        font-weight: bold;
        margin-bottom: 0.5rem;
        line-height: 1.2;
      }
    </style>
    {% endblock %}
  </head>
  <body class="bg-gray-950 text-white">
    {% block content %}
    <div class="container mx-auto px-4 py-12">
      <div class="max-w-4xl mx-auto bg-gray-900 rounded-xl shadow-lg p-8">
        <form
          id="blog-post-form"
          method="POST"
          action="{{ url_for('add_post') }}"
          enctype="multipart/form-data"
        >
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
          <input type="hidden" name="post-content" id="post-content" />

          <div class="mb-6">
            <label
              class="block text-primary font-primary text-2xl mb-3"
              for="title"
              >Title</label
            >
            <input
              class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary transition-all"
              type="text"
              id="title"
              name="title"
              placeholder="Enter the title of your post"
              required
            />
          </div>
          <div class="mb-6">
            <label
              class="block text-primary font-primary text-2xl mb-3"
              for="thumbnail"
              >Thumbnail (Optional)</label
            >
            <input
              class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary transition-all"
              type="file"
              id="thumbnail"
              name="thumbnail"
              accept="image/*"
            />
            <p
              id="thumbnailStatus"
              class="text-gray-400 mt-2 font-primary text-sm"
            ></p>
          </div>

          <div class="mb-6">
            <label
              class="block text-primary font-primary text-2xl mb-3"
              for="editor"
              >Content</label
            >
            <input
              type="file"
              id="markdown-import"
              accept=".md"
              class="hidden"
            />
            <div id="editor"></div>
          </div>

          <div class="mb-6">
            <label
              class="block text-primary font-primary text-2xl mb-3"
              for="category"
              >Category</label
            >
            <select
              class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary transition-all"
              id="category"
              name="category"
            >
              <option value="">Select a category</option>
              {% for category in categories %}
              <option value="{{ category.id }}">{{ category.name }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-6">
            <label
              class="block text-primary font-primary text-2xl mb-3"
              for="tags"
              >Tags</label
            >
            <select
              class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary transition-all"
              id="tags"
              name="tags"
              multiple
            >
              {% for tag in tags %}
              <option value="{{ tag.id }}">{{ tag.name }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="text-right">
            <button
              type="submit"
              class="bg-primary text-black px-8 py-3 rounded-full hover:bg-orange-600 transition-all font-semibold"
            >
              Publish Post
            </button>
          </div>
        </form>
      </div>
    </div>

    {% block scripts %}
    <script src="https://cdnjs.cloudflare.com/ajax/libs/froala-editor/4.0.15/js/froala_editor.pkgd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/froala-editor@latest/js/plugins/paragraph_format.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/showdown/dist/showdown.min.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Define custom SVG icon for Markdown import
        FroalaEditor.DefineIcon("markdownImport", {
          NAME: "file-upload",
          SVG_KEY: "upload",
        });

        // Register custom Markdown import command
        FroalaEditor.RegisterCommand("markdownImport", {
          title: "Import Markdown",
          focus: false,
          undo: true,
          callback: function () {
            document.getElementById("markdown-import").click();
          },
        });

        // Froala Editor Configuration
        const editorConfig = {
          imageUploadURL: "/upload_image",
          imageUploadParam: "image",
          imageUploadParams: {
            csrf_token: document.querySelector('input[name="csrf_token"]')
              .value,
          },
          videoUploadURL: "/upload_video",
          videoUploadParam: "video",
          videoUploadParams: {
            csrf_token: document.querySelector('input[name="csrf_token"]')
              .value,
          },
          imageAllowedTypes: ["jpeg", "jpg", "png"],
          imageUploadMethod: "POST",
          theme: "dark",
          toolbarButtons: [
            "bold",
            "italic",
            "underline",
            "strikeThrough",
            "fontSize",
            "textColor",
            "backgroundColor",
            "blockStyle",
            "align",
            "OrderedList",
            "UnorderedList",
            "outdent",
            "indent",
            "selectAll",
            "createLink",
            "insertImage",
            "insertVideo",
            "table",
            "undo",
            "redo",
            "html",
            "removeFormat",
            "fullscreen",
            "paragraphFormat",
            "lineHeight",
            "quote",
            "insertLink",
            "insertTable",
            "emoticons",
            "specialCharacters",
            "markdown",
            "print",
            "help",
            "markdownImport", // Custom import markdown button
          ],
          paragraphFormat: {
            N: "Normal",
            H1: "Heading 1",
            H2: "Heading 2",
            H3: "Heading 3",
          },
          paragraphDefaultSelection: "N",
          // Add custom CSS for headings
          heightMin: 300,
          heightMax: 500,
          events: {
            contentChanged: function () {
              // Ensure headings have correct styling
              const editorContent = document.querySelector("#editor");
              editorContent.querySelectorAll("h1").forEach((h1) => {
                h1.style.fontSize = "2.5rem";
                h1.style.fontWeight = "bold";
              });
              editorContent.querySelectorAll("h2").forEach((h2) => {
                h2.style.fontSize = "2rem";
                h2.style.fontWeight = "bold";
              });
              editorContent.querySelectorAll("h3").forEach((h3) => {
                h3.style.fontSize = "1.75rem";
                h3.style.fontWeight = "bold";
              });
            },
          },
        };

        // Initialize Froala Editor
        const editor = new FroalaEditor("#editor", editorConfig);

        // File input change event handler
        document
          .getElementById("markdown-import")
          .addEventListener("change", function (event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
              try {
                const markdownText = e.target.result;

                // Convert Markdown to HTML
                const converter = new showdown.Converter();
                const htmlContent = converter.makeHtml(markdownText);

                // Set content in Froala editor
                editor.html.set(htmlContent);

                // Clear the file input
                event.target.value = "";
              } catch (err) {
                console.error("Error importing Markdown:", err);
                alert(
                  "Failed to import Markdown file. Please check the file format."
                );
              }
            };
            reader.readAsText(file);
          });

        // Form submission handler
        document
          .getElementById("blog-post-form")
          .addEventListener("submit", function (e) {
            e.preventDefault();
            document.getElementById("post-content").value = editor.html.get();
            e.target.submit();
          });
      });

      document.addEventListener("DOMContentLoaded", function () {
        // Add hidden input for thumbnail URL
        const thumbnailUrlInput = document.createElement("input");
        thumbnailUrlInput.type = "hidden";
        thumbnailUrlInput.name = "thumbnail_url";
        thumbnailUrlInput.id = "thumbnail_url";
        document
          .getElementById("blog-post-form")
          .appendChild(thumbnailUrlInput);

        // Thumbnail file input handling
        const thumbnailInput = document.getElementById("thumbnail");
        const thumbnailStatus = document.getElementById("thumbnailStatus");

        thumbnailInput.addEventListener("change", function (event) {
          const file = event.target.files[0];
          if (!file) {
            thumbnailStatus.textContent = "";
            thumbnailUrlInput.value = "";
            return;
          }

          // Validate file type
          const allowedTypes = [
            "image/jpeg",
            "image/png",
            "image/gif",
            "image/webp",
          ];
          if (!allowedTypes.includes(file.type)) {
            thumbnailStatus.textContent =
              "Invalid file type. Please upload a JPEG, PNG, GIF, or WebP image.";
            thumbnailInput.value = ""; // Clear the input
            return;
          }

          // Create form data for upload
          const formData = new FormData();
          formData.append("image", file);
          formData.append(
            "csrf_token",
            document.querySelector('input[name="csrf_token"]').value
          );

          // Show uploading status
          thumbnailStatus.textContent = "Uploading...";

          // Send upload request
          fetch("/upload_image", {
            method: "POST",
            body: formData,
          })
            .then((response) => response.json())
            .then((data) => {
              if (data.success) {
                thumbnailStatus.textContent = "Thumbnail uploaded successfully";
                thumbnailUrlInput.value = data.link; // Set the hidden input with Cloudinary URL
              } else {
                throw new Error(data.error);
              }
            })
            .catch((error) => {
              console.error("Thumbnail upload error:", error);
              thumbnailStatus.textContent = `Upload failed: ${error.message}`;
              thumbnailInput.value = ""; // Clear the input
              thumbnailUrlInput.value = ""; // Clear the hidden input
            });
        });
      });
    </script>
    {% endblock %} {% endblock %}
  </body>
</html>
